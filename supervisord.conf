[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; 绪山真寻 Bot
; zx run = launcher, 由 launcher 负责 worker (zx run-worker) 的拉起/守护/优雅退出
; 直接调用 venv python, 避免运行时依赖 uv 联网解析依赖
[program:zhenxun]
command=/app/zhenxun/.venv/bin/python -m zhenxun.cli run
directory=/app/zhenxun
user=zhenxun
priority=10
autostart=true
autorestart=true
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/zhenxun",PATH="/app/zhenxun/.venv/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",TZ="%(ENV_TZ)s"

; 用户可在此追加自定义 program (如定时备份), 见 README
[include]
files=/etc/supervisor/conf.d/*.conf
