# ============================================================================
# Zhenxun Docker Framework — CICD 自动构建并上传 Docker Hub (多架构)
#
# 触发方式:
#   - push tag v*         : 发布镜像 (vX.Y.Z + latest[稳定版])
#   - 每日定时 (02:00 UTC) : nightly 镜像 (nightly-latest / nightly-日期-sha)
#   - 手动 workflow_dispatch : 自定义 tag / 上游版本
#
# 所需 Secrets (仓库 Settings -> Secrets and variables -> Actions):
#   DOCKER_HUB_USERNAME  Docker Hub 用户名
#   DOCKER_HUB_PASSWORD  Docker Hub Access Token / 密码
# 可选 Variables (仓库 Settings -> Secrets and variables -> Actions -> Variables):
#   IMAGE           Docker Hub 仓库 (默认 auto: 自动使用 DOCKER_HUB_USERNAME 命名空间)
#   GHCR_IMAGE      额外推送到 GHCR 的仓库 (默认 auto: 自动使用仓库属主; 设为 none 则关闭)
#   ZHENXUN_REF     zhenxun_bot 上游版本 (默认 main)
#   PLUGINS_REF     插件库版本 (默认 main)
#   RESOURCES_REF   主题资源版本 (默认 main)
# ============================================================================

name: docker-publish

on:
  push:
    tags:
      - "v*"
  schedule:
    # 每日 UTC 02:00 (= 北京时间 10:00) 构建 nightly
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag (留空默认 dev)"
        required: false
        default: ""
      zhenxun_ref:
        description: "zhenxun_bot 上游版本 (tag 或分支)"
        required: false
        default: ""
      plugins_ref:
        description: "zhenxun_bot_plugins 版本"
        required: false
        default: ""
      resources_ref:
        description: "zhenxun-bot-resources 版本"
        required: false
        default: ""
      also_latest:
        description: "同时更新 :latest"
        type: boolean
        required: false
        default: false

env:
  IMAGE: ${{ vars.IMAGE || 'auto' }}
  GHCR_IMAGE: ${{ vars.GHCR_IMAGE || 'auto' }}
  ZHENXUN_REF: ${{ inputs.zhenxun_ref || vars.ZHENXUN_REF || 'main' }}
  PLUGINS_REF: ${{ inputs.plugins_ref || vars.PLUGINS_REF || 'main' }}
  RESOURCES_REF: ${{ inputs.resources_ref || vars.RESOURCES_REF || 'main' }}

jobs:
  # 计算标签 / 判断 nightly 是否需要构建
  meta:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.nightly-check.outputs.skip }}
      tags: ${{ steps.tags.outputs.tags }}
      has_ghcr: ${{ steps.tags.outputs.has_ghcr }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 解析镜像仓库 (IMAGE / GHCR_IMAGE, auto 自动推导)
        id: resolve
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
        run: |
          set -euo pipefail
          IMAGE="${{ env.IMAGE }}"
          if [ "$IMAGE" = "auto" ] || [ -z "$IMAGE" ]; then
            IMAGE="${DOCKER_HUB_USERNAME}/zhenxun-docker-framework"
          fi
          GHCR_IMAGE="${{ env.GHCR_IMAGE }}"
          if [ "$GHCR_IMAGE" = "auto" ] || [ -z "$GHCR_IMAGE" ]; then
            OWNER="${{ github.repository_owner }}"
            GHCR_IMAGE="ghcr.io/${OWNER,,}/zhenxun-docker-framework"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "::notice::Docker Hub 镜像仓库: ${IMAGE}"
          echo "::notice::GHCR 镜像仓库: ${GHCR_IMAGE}"

      - name: Nightly 变更检查 (24h 内无提交则跳过)
        id: nightly-check
        if: github.event_name == 'schedule'
        run: |
          commits=$(git log --since="24 hours ago" --oneline)
          if [ -z "$commits" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::框架仓库 24h 内无提交, 跳过 nightly 构建"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 计算镜像标签
        id: tags
        run: |
          set -euo pipefail
          IMAGE="${{ steps.resolve.outputs.image }}"
          GHCR_IMAGE="${{ steps.resolve.outputs.ghcr_image }}"
          TAGS=""
          GHCR_TAGS=""
          HAS_GHCR="false"

          case "${{ github.event_name }}" in
            push)
              VERSION="${GITHUB_REF#refs/tags/}"
              case "$VERSION" in
                *beta*|*alpha*|*rc*|*pre*|*dev*) IS_PRERELEASE="true" ;;
                *) IS_PRERELEASE="false" ;;
              esac
              TAGS="${IMAGE}:${VERSION}"
              if [ "$IS_PRERELEASE" = "false" ] && [ "$VERSION" != "latest" ]; then
                TAGS="${TAGS}\n${IMAGE}:latest"
              fi
              ;;
            schedule)
              SHA="$(git rev-parse --short=12 HEAD)"
              DATE="$(date +%Y%m%d)"
              TAGS="${IMAGE}:nightly-latest\n${IMAGE}:nightly-${DATE}-${SHA}"
              ;;
            workflow_dispatch)
              VERSION="${{ inputs.tag || 'dev' }}"
              TAGS="${IMAGE}:${VERSION}"
              if [ "${{ inputs.also_latest || 'false' }}" = "true" ] && [ "$VERSION" != "latest" ]; then
                TAGS="${TAGS}\n${IMAGE}:latest"
              fi
              ;;
          esac

          # GHCR 镜像 (同后缀), 设为 none 关闭
          if [ -n "$GHCR_IMAGE" ] && [ "$GHCR_IMAGE" != "none" ]; then
            HAS_GHCR="true"
            while IFS= read -r t; do
              [ -n "$t" ] && GHCR_TAGS="${GHCR_TAGS}\n${GHCR_IMAGE}:${t#*:}"
            done < <(printf '%b' "$TAGS")
          fi

          # 合并并过滤空行
          ALL_TAGS="$(printf '%b\n' "$TAGS" "$GHCR_TAGS" | sed '/^[[:space:]]*$/d')"

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$ALL_TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "has_ghcr=${HAS_GHCR}" >> "$GITHUB_OUTPUT"

          echo "===== 镜像标签 ====="
          printf '%s\n' "$ALL_TAGS"

  docker:
    needs: meta
    if: needs.meta.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 校验 Docker Hub Secrets
        run: |
          if [ -z "${{ secrets.DOCKER_HUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_HUB_PASSWORD }}" ]; then
            echo "::error::缺少 DOCKER_HUB_USERNAME / DOCKER_HUB_PASSWORD secrets, 无法推送到 Docker Hub"
            exit 1
          fi

      - name: 预取上游源码
        run: bash ./scripts/fetch-sources.sh
        env:
          ZHENXUN_REF: ${{ env.ZHENXUN_REF }}
          PLUGINS_REF: ${{ env.PLUGINS_REF }}
          RESOURCES_REF: ${{ env.RESOURCES_REF }}

      - name: Set up QEMU (多架构仿真)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: 登录 GHCR (镜像, 可选)
        if: needs.meta.outputs.has_ghcr == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送多架构镜像 (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.meta.outputs.tags }}
          build-args: |
            ZHENXUN_REF=${{ env.ZHENXUN_REF }}
            PLUGINS_REF=${{ env.PLUGINS_REF }}
            RESOURCES_REF=${{ env.RESOURCES_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: 发布摘要
        run: |
          echo "### 镜像已发布 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${{ needs.meta.outputs.tags }}" | sed 's/^/ - /' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "上游: zhenxun_bot@${{ env.ZHENXUN_REF }} | plugins@${{ env.PLUGINS_REF }} | resources@${{ env.RESOURCES_REF }}" >> "$GITHUB_STEP_SUMMARY"
