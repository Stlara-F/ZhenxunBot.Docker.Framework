name: docker-publish

# 手动触发构建并发布多架构镜像 (linux/amd64 + linux/arm64)
on:
  workflow_dispatch:
    inputs:
      image:
        description: "镜像仓库 (registry/namespace/repo)"
        required: true
        default: "ghcr.io/zhenxun-org/zhenxun-docker-framework"
      tag:
        description: "镜像 tag"
        required: false
        default: "latest"
      zhenxun_ref:
        description: "zhenxun_bot 版本 (tag 或分支)"
        required: false
        default: "main"
      plugins_ref:
        description: "zhenxun_bot_plugins 版本"
        required: false
        default: "main"
      resources_ref:
        description: "zhenxun-bot-resources 版本"
        required: false
        default: "main"
      also_latest:
        description: "同时更新 :latest"
        type: boolean
        required: false
        default: false

env:
  IMAGE: ${{ github.event.inputs.image }}
  TAG: ${{ github.event.inputs.tag || 'latest' }}
  ZHENXUN_REF: ${{ github.event.inputs.zhenxun_ref || 'main' }}
  PLUGINS_REF: ${{ github.event.inputs.plugins_ref || 'main' }}
  RESOURCES_REF: ${{ github.event.inputs.resources_ref || 'main' }}
  ALSO_LATEST: ${{ github.event.inputs.also_latest || 'false' }}

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: startsWith(env.IMAGE, 'docker.io/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fetch zhenxun sources
        run: ./scripts/fetch-sources.sh
        env:
          ZHENXUN_REF: ${{ env.ZHENXUN_REF }}
          PLUGINS_REF: ${{ env.PLUGINS_REF }}
          RESOURCES_REF: ${{ env.RESOURCES_REF }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          build-args: |
            ZHENXUN_REF=${{ env.ZHENXUN_REF }}
            PLUGINS_REF=${{ env.PLUGINS_REF }}
            RESOURCES_REF=${{ env.RESOURCES_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    name: merge manifest
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: startsWith(env.IMAGE, 'docker.io/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge multi-arch manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          if [ "${ALSO_LATEST}" = "true" ] && [ "${TAG}" != "latest" ]; then
            docker buildx imagetools create \
              --tag "${IMAGE}:latest" \
              "${IMAGE}:${TAG}-amd64" \
              "${IMAGE}:${TAG}-arm64"
          fi
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
